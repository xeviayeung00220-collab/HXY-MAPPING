<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>牆體佈局工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{height:100vh;width:100vw;overflow:hidden;display:flex;}
#root{width:100%;height:100%;display:flex;}
.sider{width:420px;background:#fff;padding:16;overflow-y:auto;border-right:1px solid #eee;}
.canvas-wrap{flex:1;background:#ddd;padding:16;display:flex;flex-direction:column;gap:16;}
.card{border:1px solid #e8e8e8;border-radius:6;padding:12;margin-top:16;}
.form-item{margin-bottom:12;}
label{display:block;margin-bottom:4;font-size:14;color:#333;}
input[type="number"],input[type="text"],select{width:100%;padding:6 8;border:1px solid #ccc;border-radius:4;}
input[type="color"]{width:100%;height:36;border:none;cursor:pointer;}
.btn{padding:6 12;border:none;border-radius:4;cursor:pointer;margin:4 0;}
.btn-primary{background:#1677ff;color:#fff;}
.btn-danger{background:#ff4d4f;color:#fff;}
.btn-small{padding:4 8;font-size:12;}
.flex-row{display:flex;gap:8;align-items:center;justify-content:space-between;margin:8 0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8;}
.layer-block{background:#f8f8f8;padding:10;border-radius:6;margin:8 0;}
.preview-box{background:#fff;border:1px solid #ccc;padding:10;border-radius:8;max-height:420;overflow:auto;}
.canvas-container{flex:1;background:#ddd;border-radius:8;overflow:hidden;}
.wall-item{padding:10 14;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.wall-active{background:#e6f7ff;}
</style>
<!-- 國內可穩定訪問CDN jsdelivr -->
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-konva@18/umd/react-konva.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener('load', function(){
const jsxCode = `
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { Stage, Layer, Rect, Line, Circle, Text, Image: KonvaImage, Group } = ReactKonva;
const DEFAULT_SCALE = 0.2;
const TEXT_SCALE_FACTOR = 5;
const modelParams = {
  T3: { singleRes: [256, 128], size: [1.0, 0.5] },
  C4: { singleRes: [104, 208], size: [0.5, 1.0] },
  C5: { singleRes: [84, 168], size: [0.5, 0.1] },
  "DN2.9": { singleRes: [168, 168], size: [0.5, 0.5] },
  F3: { singleRes: [128, 128], size: [0.5, 0.5] },
  F3_1M: { singleRes: [128, 256], size: [0.5, 1.0] },
  F2: { singleRes: [192, 192], size: [0.5, 0.5] },
  Custom: { singleRes: [0, 0], size: [0, 0] },
};
const initialWalls = [{id:1,name:"牆體 1",model:"T3",col:7,row:8,singleRes:[256,128],size:[0.5,0.5],x:0,y:0,color1:"#ffffff",color2:"#000000",showLabel:true,labelSize:12,labelColor1:"#000",labelColor2:"#fff",showDiagonal:true,diagonalColor:"#ff4444",diagonalLineWidth:2,diagonalLineType:"solid",diagonalDashGap:10,showCircle:true,circleRadius:80,circleColor:"#222",circleLineWidth:2,circleLineType:"solid",circleDashGap:10,showOuterFrame:true,outerFrameColor:"#1a90d9",outerFrameLineWidth:3,outerFrameLineType:"solid",outerFrameDashGap:10,textLayers:[],logos:[]}];
const safeNum = (val, fallback = 0) => {const n = Number(val);return Number.isNaN(n) ? fallback : n;};
const getStrokeDash = (lineType, gap) => lineType === "dashed" ? [gap, gap] : [];
const createDefaultTextLayer = (id) => ({id,content:"新文字",x:0,y:0,size:32,color:"#000",bold:false,stroke:false,strokeColor:"#fff",strokeWidth:2,shadow:false,shadowX:2,shadowY:2,shadowBlur:3,shadowColor:"#666"});
const createDefaultWall = (wallId) => ({id:wallId,name:\`牆體\${wallId}\`,x:0,y:0,model:"",col:7,row:8,singleRes:[256,128],size:[0.5,0.5],color1:"#fff",color2:"#000",showLabel:true,labelSize:12,labelColor1:"#000",labelColor2:"#fff",showDiagonal:true,diagonalColor:"#ff4444",diagonalLineType:"solid",diagonalLineWidth:2,diagonalDashGap:10,showCircle:true,circleRadius:80,circleColor:"#222",circleLineType:"solid",circleLineWidth:2,circleDashGap:10,showOuterFrame:true,outerFrameColor:"#1a90d9",outerFrameLineType:"solid",outerFrameLineWidth:3,outerFrameDashGap:10,textLayers:[],logos:[]});
const WallComponent = ({ wall, scale = 0.5, draggable = true, onDragEnd }) => {
  const { col, row, singleRes, x:wallX, y:wallY, color1, color2, showLabel, labelSize, labelColor1, labelColor2, showDiagonal, diagonalColor, diagonalLineWidth, diagonalLineType, diagonalDashGap, showCircle, circleRadius, circleColor, circleLineWidth, circleDashGap, showOuterFrame, outerFrameColor, outerFrameLineWidth, outerFrameLineType, outerFrameDashGap, textLayers, logos } = wall;
  const calc = useMemo(() => {
    const baseW = Math.max(1, safeNum(singleRes[0], 1));
    const baseH = Math.max(1, safeNum(singleRes[1], 1));
    const cellW = baseW * scale;
    const cellH = baseH * scale;
    const totalCol = safeNum(col,1);
    const totalRow = safeNum(row,1);
    const totalWidth = totalCol * cellW;
    const totalHeight = totalRow * cellH;
    const centerX = totalWidth / 2;
    const centerY = totalHeight / 2;
    const realCircleR = safeNum(circleRadius) * scale;
    const diagMax = Math.hypot(centerX, centerY);
    let cutRatio = diagMax > 0 ? (diagMax - realCircleR) / diagMax : 1;
    cutRatio = Math.max(0, cutRatio);
    return { cellW, cellH, totalCol, totalRow, totalWidth, totalHeight, centerX, centerY, realCircleR, cutX:centerX*cutRatio, cutY:centerY*cutRatio };
  }, [wall, scale, circleRadius, singleRes, col, row]);
  const logoElements = useMemo(() => logos.filter(l=>l.src).map(logo=>{const img = new Image();img.src = logo.src;return {...logo, img};}), [logos]);
  const renderText = (layer) => {
    const fontSize = safeNum(layer.size) * scale * TEXT_SCALE_FACTOR || 12;
    return (<Text key={\`text-\${layer.id}\`} x={safeNum(layer.x)*scale} y={safeNum(layer.y)*scale} text={layer.content} fontSize={fontSize} fill={layer.color} fontWeight={layer.bold ? "bold" : "normal"} align="center" stroke={layer.stroke ? layer.strokeColor : ""} strokeWidth={layer.stroke ? safeNum(layer.strokeWidth)*scale : 0} shadowEnabled={layer.shadow} shadowColor={layer.shadow ? layer.shadowColor : "#000"} shadowBlur={layer.shadow ? safeNum(layer.shadowBlur)*scale : 0} shadowOffset={layer.shadow ? {x:safeNum(layer.shadowX)*scale, y:safeNum(layer.shadowY)*scale} : {x:0,y:0}} listening={false}/>);
  };
  const renderFrame = () => {
    if(!showOuterFrame) return null;
    const sw = safeNum(outerFrameLineWidth)*scale;
    const half = sw / 2;
    return (<Rect key="frame" x={half} y={half} width={calc.totalWidth - sw} height={calc.totalHeight - sw} stroke={outerFrameColor} strokeWidth={sw} dash={getStrokeDash(outerFrameLineType, safeNum(outerFrameDashGap)*scale)} fill="transparent"/>);
  };
  return (<Group x={safeNum(wallX)*scale} y={safeNum(wallY)*scale} draggable={draggable} onDragEnd={(e)=>onDragEnd && onDragEnd(safeNum(e.target.x())/scale, safeNum(e.target.y())/scale)}>
    {Array.from({length:calc.totalRow}).map((_,ri)=>Array.from({length:calc.totalCol}).map((_,ci)=>{
      const x = ci * calc.cellW;
      const y = ri * calc.cellH;
      const odd = (ri+ci)%2 === 1;
      return (<Group key={\`cell-r\${ri}c\${ci}\`}><Rect x={x} y={y} width={calc.cellW} height={calc.cellH} fill={odd ? color2 : color1} stroke="#ccc" strokeWidth={0.5}/>{showLabel && (<Text x={x} y={y} width={calc.cellW} height={calc.cellH} text={\`\${String.fromCharCode(65+ci)}-\${ri+1}\`} fontSize={safeNum(labelSize)*scale} fill={odd ? labelColor2 : labelColor1} align="center" verticalAlign="middle" listening={false}/>)}</Group>);
    }))}
    {renderFrame()}
    {showDiagonal && (<><Line points={[0,0,calc.cutX,calc.cutY]} stroke={diagonalColor} strokeWidth={safeNum(diagonalLineWidth)*scale} dash={getStrokeDash(diagonalLineType, safeNum(diagonalDashGap)*scale)}/><Line points={[calc.totalWidth,0,calc.totalWidth-calc.cutX,calc.cutY]} stroke={diagonalColor} strokeWidth={safeNum(diagonalLineWidth)*scale} dash={getStrokeDash(diagonalLineType, safeNum(diagonalDashGap)*scale)}/><Line points={[0,calc.totalHeight,calc.cutX,calc.totalHeight-calc.cutY]} stroke={diagonalColor} strokeWidth={safeNum(diagonalLineWidth)*scale} dash={getStrokeDash(diagonalLineType, safeNum(diagonalDashGap)*scale)}/><Line points={[calc.totalWidth,calc.totalHeight,calc.totalWidth-calc.cutX,calc.totalHeight-calc.cutY]} stroke={diagonalColor} strokeWidth={safeNum(diagonalLineWidth)*scale} dash={getStrokeDash(diagonalLineType, safeNum(diagonalDashGap)*scale)}/></>)}
    {showCircle && calc.realCircleR > 0 && (<Circle x={calc.centerX} y={calc.centerY} radius={calc.realCircleR} stroke={circleColor} strokeWidth={safeNum(circleLineWidth)*scale} dash={getStrokeDash(circleLineType, safeNum(circleDashGap)*scale)} fill="transparent"/>)}
    {textLayers.map(renderText)}
    {logoElements.map(logo=>(<KonvaImage key={\`logo-\${logo.id}\`} image={logo.img} x={safeNum(logo.x)*scale} y={safeNum(logo.y)*scale} width={safeNum(logo.width)*scale} height={safeNum(logo.height)*scale} opacity={Math.max(0, Math.min(100, safeNum(logo.opacity,100)))/100} preserveAspectRatio={logo.keepRatio ? "xMidYMid meet" : "none"}/>))}
  </Group>);
};
const WallEditForm = ({ wall, updateWall, addTextLayer, delTextLayer, handleLogoChange, uploadLogo, addLogo, delLogo }) => {
  const updateField = useCallback((key, val)=>updateWall(wall.id, {[key]:val}), [wall.id, updateWall]);
  const updateTextItem = useCallback((idx, key, val)=>{const newLayers = wall.textLayers.map((item,i)=>i===idx ? {...item, [key]:val} : {...item});updateWall(wall.id, {textLayers:newLayers});}, [wall, updateWall]);
  const changeModel = useCallback((val)=>{if(val === "Custom") return updateWall(wall.id, {model:"Custom", singleRes:[0,0], size:[0,0]});const cfg = modelParams[val];updateWall(wall.id, {model:val, singleRes:cfg.singleRes, size:cfg.size});}, [wall.id, updateWall]);
  return (<div className="card"><h3>編輯：{wall.name}</h3>
  <div className="form-item"><label>X座標</label><input type="number" value={wall.x} onChange={(e)=>updateField("x", Number(e.target.value))}/></div>
  <div className="form-item"><label>Y座標</label><input type="number" value={wall.y} onChange={(e)=>updateField("y", Number(e.target.value))}/></div>
  <div className="form-item"><label>牆體型號</label><select value={wall.model} onChange={(e)=>changeModel(e.target.value)}>{Object.keys(modelParams).map(k=><option key={k} value={k}>{k}</option>)}</select></div>
  <div className="grid-2"><div className="form-item"><label>總列數 col</label><input type="number" min="1" max="100" value={wall.col} onChange={(e)=>updateWall(wall.id, {col:Number(e.target.value)||1})}/></div><div className="form-item"><label>總行數 row</label><input type="number" min="1" max="100" value={wall.row} onChange={(e)=>updateWall(wall.id, {row:Number(e.target.value)||1})}/></div></div>
  <div className="form-item"><label>單格解析度</label><input type="text" readOnly value={\`\${safeNum(wall.singleRes[0])} × \${safeNum(wall.singleRes[1])}\`}/></div>
  <div className="form-item"><label>尺寸</label><input type="text" readOnly value={\`\${safeNum(wall.size[0])} × \${safeNum(wall.size[1])}\`}/></div>
  <div className="form-item"><label>總解析度</label><input type="text" readOnly value={\`\${safeNum(wall.singleRes[0])*safeNum(wall.col)} × \${safeNum(wall.singleRes[1])*safeNum(wall.row)}\`}/></div>
  {wall.model === "Custom" && (<><div className="grid-2"><div className="form-item"><label>自訂解析度寬</label><input type="number" value={wall.singleRes[0]} onChange={(e)=>updateField("singleRes", [Number(e.target.value), wall.singleRes[1]])}/></div><div className="form-item"><label>自訂解析度高</label><input type="number" value={wall.singleRes[1]} onChange={(e)=>updateField("singleRes", [wall.singleRes[0], Number(e.target.value)])}/></div></div><div className="grid-2"><div className="form-item"><label>尺寸寬</label><input step="0.1" type="number" value={wall.size[0]} onChange={(e)=>updateField("size", [Number(e.target.value), wall.size[1]])}/></div><div className="form-item"><label>尺寸高</label><input step="0.1" type="number" value={wall.size[1]} onChange={(e)=>updateField("size", [wall.size[0], Number(e.target.value)])}/></div></div></>)}
  <div className="form-item"><label>格子顏色1</label><input type="color" value={wall.color1} onChange={(e)=>updateField("color1",e.target.value)}/></div>
  <div className="form-item"><label>格子顏色2</label><input type="color" value={wall.color2} onChange={(e)=>updateField("color2",e.target.value)}/></div>
  <div className="flex-row"><label>顯示標籤</label><input type="checkbox" checked={wall.showLabel} onChange={(e)=>updateField("showLabel",e.target.checked)}/></div>
  <div className="form-item"><label>標籤大小</label><input type="number" min="1" value={wall.labelSize} onChange={(e)=>updateField("labelSize",Number(e.target.value))}/></div>
  <div className="form-item"><label>標籤色1</label><input type="color" value={wall.labelColor1} onChange={(e)=>updateField("labelColor1",e.target.value)}/></div>
  <div className="form-item"><label>標籤色2</label><input type="color" value={wall.labelColor2} onChange={(e)=>updateField("labelColor2",e.target.value)}/></div>
  <div className="flex-row"><label>顯示斜線</label><input type="checkbox" checked={wall.showDiagonal} onChange={(e)=>updateField("showDiagonal",e.target.checked)}/></div>
  <div className="form-item"><label>斜線樣式</label><select value={wall.diagonalLineType} onChange={(e)=>updateField("diagonalLineType",e.target.value)}><option value="solid">實線</option><option value="dashed">虛線</option></select></div>
  <div className="form-item"><label>斜線寬度</label><input type="number" min="1" value={wall.diagonalLineWidth} onChange={(e)=>updateField("diagonalLineWidth",Number(e.target.value))}/></div>
  <div className="form-item"><label>斜線虛線間距</label><input type="number" min="1" value={wall.diagonalDashGap} onChange={(e)=>updateField("diagonalDashGap",Number(e.target.value))}/></div>
  <div className="form-item"><label>斜線顏色</label><input type="color" value={wall.diagonalColor} onChange={(e)=>updateField("diagonalColor",e.target.value)}/></div>
  <div className="flex-row"><label>顯示圓圈</label><input type="checkbox" checked={wall.showCircle} onChange={(e)=>updateField("showCircle",e.target.checked)}/></div>
  <div className="form-item"><label>圓圈樣式</label><select value={wall.circleLineType} onChange={(e)=>updateField("circleLineType",e.target.value)}><option value="solid">實線</option><option value="dashed">虛線</option></select></div>
  <div className="form-item"><label>圓半徑</label><input type="number" min="0" value={wall.circleRadius} onChange={(e)=>updateField("circleRadius",Number(e.target.value))}/></div>
  <div className="form-item"><label>圓線寬</label><input type="number" min="1" value={wall.circleLineWidth} onChange={(e)=>updateField("circleLineWidth",Number(e.target.value))}/></div>
  <div className="form-item"><label>圓虛線間距</label><input type="number" min="1" value={wall.circleDashGap} onChange={(e)=>updateField("circleDashGap",Number(e.target.value))}/></div>
  <div className="form-item"><label>圓圈顏色</label><input type="color" value={wall.circleColor} onChange={(e)=>updateField("circleColor",e.target.value)}/></div>
  <div className="flex-row"><label>顯示外框</label><input type="checkbox" checked={wall.showOuterFrame} onChange={(e)=>updateField("showOuterFrame",e.target.checked)}/></div>
  <div className="form-item"><label>外框樣式</label><select value={wall.outerFrameLineType} onChange={(e)=>updateField("outerFrameLineType",e.target.value)}><option value="solid">實線</option><option value="dashed">虛線</option></select></div>
  <div className="form-item"><label>外框寬</label><input type="number" min="1" value={wall.outerFrameLineWidth} onChange={(e)=>updateField("outerFrameLineWidth",Number(e.target.value))}/></div>
  <div className="form-item"><label>外框虛線間距</label><input type="number" min="1" value={wall.outerFrameDashGap} onChange={(e)=>updateField("outerFrameDashGap",Number(e.target.value))}/></div>
  <div className="form-item"><label>外框顏色</label><input type="color" value={wall.outerFrameColor} onChange={(e)=>updateField("outerFrameColor",e.target.value)}/></div>
  <div className="flex-row"><h4>文字圖層</h4><button className="btn btn-small btn-primary" onClick={addTextLayer}>新增文字</button></div>
  {wall.textLayers.map((layer, idx)=> (<div className="layer-block" key={layer.id}><div className="flex-row"><span>圖層 {idx+1}</span><button className="btn btn-small btn-danger" onClick={()=>delTextLayer(layer.id)}>刪除</button></div><div className="form-item"><label>文字內容</label><input type="text" value={layer.content} onChange={(e)=>updateTextItem(idx,"content",e.target.value)}/></div><div className="grid-2"><div className="form-item"><label>X</label><input type="number" value={layer.x} onChange={(e)=>updateTextItem(idx,"x",Number(e.target.value))}/></div><div className="form-item"><label>Y</label><input type="number" value={layer.y} onChange={(e)=>updateTextItem(idx,"y",Number(e.target.value))}/></div></div><div className="form-item"><label>字體大小</label><input type="number" value={layer.size} onChange={(e)=>updateTextItem(idx,"size",Number(e.target.value))}/></div><div className="form-item"><label>文字顏色</label><input type="color" value={layer.color} onChange={(e)=>updateTextItem(idx,"color",e.target.value)}/></div><div className="flex-row"><label>粗體</label><input type="checkbox" checked={layer.bold} onChange={(e)=>updateTextItem(idx,"bold",e.target.checked)}/></div><div className="flex-row"><label>描邊</label><input type="checkbox" checked={layer.stroke} onChange={(e)=>updateTextItem(idx,"stroke",e.target.checked)}/></div>{layer.stroke && (<div style={{border:"1px solid #eee",padding:8,borderRadius:4}}><div className="form-item"><label>描邊色</label><input type="color" value={layer.strokeColor} onChange={(e)=>updateTextItem(idx,"strokeColor",e.target.value)}/></div><div className="form-item"><label>描邊寬度</label><input type="number" min="1" value={layer.strokeWidth} onChange={(e)=>updateTextItem(idx,"strokeWidth",Number(e.target.value))}/></div></div>)}<div className="flex-row"><label>陰影</label><input type="checkbox" checked={layer.shadow} onChange={(e)=>updateTextItem(idx,"shadow",e.target.checked)}/></div>{layer.shadow && (<div style={{border:"1px dashed #ccc",padding:8,borderRadius:4}}><div className="grid-2"><div className="form-item"><label>陰影X偏移</label><input type="number" value={layer.shadowX} onChange={(e)=>updateTextItem(idx,"shadowX",Number(e.target.value))}/></div><div className="form-item"><label>陰影Y偏移</label><input type="number" value={layer.shadowY} onChange={(e)=>updateTextItem(idx,"shadowY",Number(e.target.value))}/></div></div><div className="form-item"><label>模糊程度</label><input type="number" min="0" value={layer.shadowBlur} onChange={(e)=>updateTextItem(idx,"shadowBlur",Number(e.target.value))}/></div><div className="form-item"><label>陰影顏色</label><input type="color" value={layer.shadowColor} onChange={(e)=>updateTextItem(idx,"shadowColor",e.target.value)}/></div></div>)}</div>))}
  <div className="flex-row"><h4>Logo圖片</h4><button className="btn btn-small btn-primary" onClick={addLogo}>新增Logo</button></div>
  {wall.logos.map((logo, idx)=>(<div className="layer-block" key={logo.id}><div className="flex-row"><span>圖片 {idx+1}</span><button className="btn btn-small btn-danger" onClick={()=>delLogo(logo.id)}>刪除</button></div><input type="file" accept="image/*" onChange={(e)=>uploadLogo(e,idx)}/><div className="grid-2"><label>X</label><input type="number" value={logo.x} onChange={(e)=>handleLogoChange(idx,"x",Number(e.target.value)??0)}/><label>Y</label><input type="number" value={logo.y} onChange={(e)=>handleLogoChange(idx,"y",Number(e.target.value)??0)}/><label>寬</label><input type="number" value={logo.width} onChange={(e)=>handleLogoChange(idx,"width",Number(e.target.value)??0)}/><label>高</label><input type="number" value={logo.height} onChange={(e)=>handleLogoChange(idx,"height",Number(e.target.value)??0)}/><label>透明度</label><input type="number" min="0" max="100" value={logo.opacity} onChange={(e)=>handleLogoChange(idx,"opacity",Number(e.target.value)??100)}/></div><div className="flex-row" style={{marginTop:8}}><span>鎖定比例</span><input type="checkbox" checked={logo.keepRatio} onChange={(e)=>handleLogoChange(idx,"keepRatio",e.target.checked)}/></div></div>))}
  </div>);
};
let globalIdSeed = 1000;
const genId = () => ++globalIdSeed;
const App = () => {
  const [walls, setWalls] = useState(initialWalls);
  const [selectedId, setSelectedId] = useState(null);
  const stageContainerRef = useRef(null);
  const stageRef = useRef(null);
  const [viewport, setViewport] = useState({width:800,height:600});
  const selectedWall = useMemo(()=>walls.find(w=>w.id === selectedId) ?? null, [walls, selectedId]);
  const updateWall = useCallback((tid, patch)=>setWalls(p=>p.map(w=>w.id===tid ? {...w,...patch} : w)), []);
  const addWall = useCallback(()=>{const newW = createDefaultWall(genId());setWalls(p=>[...p, newW]);setSelectedId(newW.id);}, []);
  const addText = useCallback(()=>{if(!selectedWall) return;updateWall(selectedWall.id, {textLayers:[...selectedWall.textLayers, createDefaultTextLayer(genId())]});}, [selectedWall, updateWall]);
  const delText = useCallback((lid)=>{if(!selectedWall) return;updateWall(selectedWall.id, {textLayers:selectedWall.textLayers.filter(t=>t.id !== lid)});}, [selectedWall, updateWall]);
  const changeLogo = useCallback((idx, key, val)=>{if(!selectedWall) return;const arr = [...selectedWall.logos];arr[idx] = {...arr[idx], [key]:val};updateWall(selectedWall.id, {logos:arr});}, [selectedWall, updateWall]);
  const uploadImg = useCallback((e, idx)=>{const file = e.target.files?.[0];if(!file) return;const reader = new FileReader();reader.onload = ev => changeLogo(idx, "src", ev.target.result);reader.readAsDataURL(file);}, [changeLogo]);
  const addLogo = useCallback(()=>{if(!selectedWall) return;const newLogo = {id:genId(), src:"", x:0,y:0, width:200,height:200, opacity:100, keepRatio:true};updateWall(selectedWall.id, {logos:[...selectedWall.logos, newLogo]});}, [selectedWall, updateWall]);

  }, []);
  return (<div id="root"><div className="sider"><div className="flex-row"><h3>牆體列表</h3><button className="btn btn-danger btn-small" onClick={exportAll}>下載總畫布</button></div><button className="btn btn-primary" style={{width:"100%"}} onClick={addWall}>新增牆體</button><div style={{border:"1px solid #e8e8e8",borderRadius:6,margin:8}}>{walls.map(item=>(<div key={\`wall-\${item.id}\`} className={\`wall-item \${selectedId===item.id ? "wall-active" : ""}\`} onClick={()=>setSelectedId(item.id)}><span>{item.name}</span><button className="btn btn-small" onClick={(e)=>{e.stopPropagation(); exportSingle(item);}}>下載單牆</button></div>))}</div>{!selectedWall && <p style={{textAlign:"center",marginTop:40,color:"#999"}}>點擊牆體進行編輯</p>}{selectedWall && (<WallEditForm wall={selectedWall} updateWall={updateWall} addTextLayer={addText} delTextLayer={delText} handleLogoChange={changeLogo} uploadLogo={uploadImg} addLogo={addLogo} delLogo={delLogo}/>)}</div><div className="canvas-wrap"><div className="preview-box"><div className="flex-row"><h4>1:1 真實尺寸預覽</h4>{selectedWall && <button className="btn btn-primary" onClick={()=>exportSingle(selectedWall)}>下載當前牆體</button>}</div><div style={{maxHeight:420,overflow:"auto",background:"#f9f9f9",border:"1px solid #eee",marginTop:8}}>{previewWall ? ((()=>{const pw = safeNum(previewWall.singleRes[0]) * safeNum(previewWall.col);const ph = safeNum(previewWall.singleRes[1]) * safeNum(previewWall.row);const scale = 0.4;return (<div style={{transform:\`scale(\${scale})\`,transformOrigin:"top left"}}><Stage className="preview-stage" width={pw} height={ph}><Layer clip={{x:0,y:0,width:pw,height:ph}}><Rect x={0} y={0} width={pw} height={ph} fill="#fff" listening={false}/><WallComponent wall={previewWall} scale={1} draggable={false}/></Layer></Stage></div>);})()) : <p style={{color:"#999",padding:20}}>請選擇左側牆體</p>}</div></div><div ref={stageContainerRef} className="canvas-container main-canvas-wrap"><Stage ref={stageRef} width={viewport.width} height={viewport.height} preserveDrawingBuffer><Layer>{walls.map(w=>(<WallComponent key={\`canvas-\${w.id}\`} wall={w} scale={DEFAULT_SCALE} onDragEnd={(x,y)=>dragEnd(w.id,x,y)}/>))}</Layer></Stage></div></div></div>);

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
